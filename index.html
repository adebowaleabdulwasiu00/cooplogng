<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/src/icon/Logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cooperative Log App</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#3b82f6">
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <script>
    var SW_BUILD = /*__SW_BUILD__*/ 1;
    // Packaged shells (Electron file://, native WebViews) have no SW scope — skip.
    var __isPackagedShell = location.protocol === 'file:' || !!window.cooplog || !!window.Capacitor;
    // Dev servers (vite `npm run dev`) must never install the SW: with no
    // build stamp the version churns per load and skipWaiting+claim +
    // controllerchange turns into an infinite F5 loop. Production hosting
    // keeps the SW auto-update behaviour unchanged.
    var __host = (location.hostname || '').toLowerCase();
    var __isDevHost = __host === 'localhost' || __host === '127.0.0.1' || __host === '[::1]' || __host === '';
    if ('serviceWorker' in navigator && !__isPackagedShell && !__isDevHost) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js?v=' + SW_BUILD)
          .then(function(reg) {
            console.log('[PWA] SW Registered (v' + SW_BUILD + ')');
            reg.update();
          })
          .catch(function(err) { return console.error('[PWA] SW Failed', err); })
      })
    }
    // One-time cleanup for dev tabs stuck under a previously installed
    // looping worker: drop stale localhost registrations so the F5 loop
    // stops immediately on next visit. Production registrations untouched.
    if ('serviceWorker' in navigator && __isDevHost && !__isPackagedShell) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(r) { r.unregister().catch(function() {}); });
      }).catch(function() {});
    }
  </script>
</body>

</html>
